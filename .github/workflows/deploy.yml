name: Deploy Monorepo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Nyomin's Birthday Quest (hbd-nyomin)
        run: |
          cd hbd-nyomin
          npm ci
          npm run build
          cd ..

      - name: Assemble Public Site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r hbd-nyomin/dist _site/hbd-nyomin
          cp -r hbd-zul _site/hbd-zul
          cp -r nusaeco _site/nusaeco

      - name: Cache Akutoo npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-akutoo-npm-${{ hashFiles('akutoo-m0/package-lock.json') }}

      - name: Install Akutoo dependencies
        working-directory: akutoo-m0
        run: npm ci

      - name: Test Akutoo units
        working-directory: akutoo-m0
        run: npm test

      - name: Build Akutoo
        working-directory: akutoo-m0
        run: npm run build

      - name: Assemble Akutoo
        run: cp -r akutoo-m0/dist _site/akutoo-m0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
